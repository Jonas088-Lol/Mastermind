# ── ModSecurity Hauptkonfiguration — MasterMind ────────────────────────────
# Ziel im Container: /etc/nginx/modsec/main.conf  (via include eingebunden)
#
# WICHTIG — Rollout-Strategie (siehe docs/security/waf-tuning.md):
#   1. START im DetectionOnly-Modus (loggt Treffer, blockt NICHTS).
#   2. Echten Traffic ein paar Tage laufen lassen, Audit-Log auswerten.
#   3. False Positives per Rule-ID ausschließen (crs-exclusions.conf).
#   4. ERST DANN: SecRuleEngine On (scharf schalten).
#
# WARUM DetectionOnly zuerst: Das OWASP-CRS ist streng und produziert bei
# echten Apps zunächst False Positives (z.B. auf JSON-Payloads, KaTeX-LaTeX,
# Rich-Text). Sofort scharf = legitimer Traffic wird blockiert.

# ── Engine-Modus ───────────────────────────────────────────────────────────
# Phase 2 Start: DetectionOnly. Nach Tuning auf "On" ändern.
SecRuleEngine DetectionOnly

# ── Request-Body verarbeiten (für POST/JSON-Inspektion) ────────────────────
SecRequestBodyAccess On
SecRequestBodyLimit 13107200          # 12 MB (deckt Datei-Uploads ab)
SecRequestBodyNoFilesLimit 131072     # 128 KB für Nicht-Datei-Bodies
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 32

# ── Response-Body NUR bei Fehlerseiten prüfen (Performance) ────────────────
SecResponseBodyAccess Off

# ── Datei-Uploads: nicht auf Platte behalten ───────────────────────────────
SecTmpDir /tmp/
SecDataDir /tmp/
SecUploadKeepFiles Off

# ── Audit-Logging: nur relevante Treffer, JSON, ohne sensible Bodies ───────
# WARUM kein Full-Body-Logging: sonst landen Passwörter/PII im WAF-Log.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ          # KEIN 'C' (Request-Body) → keine PII/Passwörter im Log
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log
SecAuditLogFormat JSON

# ── Fehlerbehandlung ───────────────────────────────────────────────────────
SecDefaultAction "phase:1,log,auditlog,pass"

# ── PCRE-Limits gegen ReDoS in den Rules selbst ────────────────────────────
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# ── Statusseite bei Block (wenn scharf) ────────────────────────────────────
SecStatusEngine Off

# ── OWASP Core Rule Set laden ──────────────────────────────────────────────
# Das offizielle owasp/modsecurity-crs:nginx-Image legt CRS unter
# /etc/modsecurity.d/owasp-crs ab und lädt es selbst. Bei eigenem Build:
#   Include /etc/nginx/modsec/crs-setup.conf
#   Include /etc/nginx/modsec/rules/*.conf

# ── Projekt-spezifische Ausnahmen (nach dem Tuning befüllen) ───────────────
Include /etc/nginx/modsec/crs-exclusions.conf
