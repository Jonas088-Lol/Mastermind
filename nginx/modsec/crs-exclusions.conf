# ── CRS-Ausnahmen für MasterMind ───────────────────────────────────────────
# Ziel: /etc/nginx/modsec/crs-exclusions.conf
#
# HIER kommen NUR die nach dem DetectionOnly-Tuning bestätigten False-Positive-
# Ausnahmen rein. Jede Ausnahme mit Kommentar: WELCHE Route, WARUM legitim.
# Prinzip: so eng wie möglich (nur betroffene Route + Regel-ID), nie global.
#
# Ablauf zum Befüllen: siehe docs/security/waf-tuning.md
#
# ── Erwartbare Kandidaten bei dieser App (erst nach Log-Auswertung aktivieren!):
#
# 1) KaTeX/LaTeX-Formeln (Heft-Editor) enthalten \, {}, ^ → kann CRS als
#    "Command Injection" / "PHP Injection" fehldeuten.
# Beispiel (auskommentiert — erst nach Bestätigung im Log einschalten):
# SecRule REQUEST_URI "@beginsWith /api/masterspace" \
#   "id:1000001,phase:1,pass,nolog,ctl:ruleRemoveById=942100"
#
# 2) Rich-Text/Markdown in Notizen/Nachrichten → HTML-artige Zeichen können
#    XSS-Regeln (941xxx) triggern, obwohl serverseitig sanitisiert.
# SecRule REQUEST_URI "@beginsWith /api/masterspace" \
#   "id:1000002,phase:2,pass,nolog,ctl:ruleRemoveTargetById=941100;ARGS:content"
#
# 3) Anthropic-Prompt-Payloads (falls je über einen geproxyten Endpoint) →
#    lange freie Texte lösen oft Anomaly-Scores aus.
#
# Solange nichts bestätigt ist, bleibt diese Datei bewusst LEER (nur Kommentare).
