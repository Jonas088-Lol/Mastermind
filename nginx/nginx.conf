user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 25M;  # Allow file uploads up to 25MB

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ── Security headers (base — app adds its own CSP) ─────────────────────
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Echte Client-IP hinter Cloudflare ──────────────────────────────────
    # WARUM: Ohne real_ip ist $remote_addr die Cloudflare-IP — alle Nutzer
    # teilen sich dann dasselbe Rate-Limit (wirkungslos oder Kollateral-Block).
    # Wir vertrauen NUR dem CF-Connecting-IP-Header und NUR von CF-Ranges.
    # ⚠ Diese CF-Ranges müssen aktuell gehalten werden (siehe
    #   scripts/nginx-cloudflare-realip.sh, das die include-Datei generiert).
    include /etc/nginx/cloudflare-realip.conf;   # set_real_ip_from … (generiert)
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # ── Rate limiting zones (echte, wirksame Limits) ───────────────────────
    # Zweite Verteidigungslinie hinter Cloudflares Rate-Limiting. Bewusst
    # großzügig genug für normale Nutzung, eng genug gegen Brute-Force/Scraping.
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;   # allg. Seiten
    limit_req_zone $binary_remote_addr zone=api:10m      rate=15r/s;  # API
    # Auth (Login/Register/Reset): nur POST zählt, sehr eng gegen Brute-Force.
    map $request_method $auth_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ── Upstream ───────────────────────────────────────────────────────────
    upstream nextjs {
        server app:3000;
        keepalive 32;
    }

    # Include virtual host configs
    include /etc/nginx/conf.d/*.conf;
}
