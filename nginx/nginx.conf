user  nginx;
worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 25M;  # Allow file uploads up to 25MB

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # ── Security headers (base — app adds its own CSP) ─────────────────────
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header X-XSS-Protection         "1; mode=block"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ── Rate limiting zones ────────────────────────────────────────────────
    # Zones exist so the location blocks referencing them don't break,
    # but limits are set high enough to never trigger in practice.
    limit_req_zone $binary_remote_addr zone=general:10m rate=500r/s;
    limit_req_zone $binary_remote_addr zone=api:10m      rate=500r/s;
    map $request_method $auth_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $auth_limit_key zone=auth:10m rate=500r/m;
    limit_req_status 429;

    # ── Upstream ───────────────────────────────────────────────────────────
    upstream nextjs {
        server app:3000;
        keepalive 32;
    }

    # Include virtual host configs
    include /etc/nginx/conf.d/*.conf;
}
