# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot ACME challenge (needed for Let's Encrypt SSL issuance)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Replace with your actual domain
    server_name konvertis.de www.konvertis.de;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/konvertis.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/konvertis.de/privkey.pem;

    # Modern SSL config (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Static assets: aggressive caching ──────────────────────────────────
    # Next.js _next/static files are content-hashed → safe to cache forever
    location /_next/static/ {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public uploads & static files
    location /uploads/ {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Service worker — no cache (must always be fresh)
    location = /sw.js {
        proxy_pass         http://nextjs;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # ── API rate limiting ───────────────────────────────────────────────────
    location /api/ai/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI streaming needs longer timeout
        proxy_buffering    off;   # SSE streaming
    }

    location /login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Default: proxy everything to Next.js ───────────────────────────────
    location / {
        limit_req zone=general burst=20 nodelay;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
