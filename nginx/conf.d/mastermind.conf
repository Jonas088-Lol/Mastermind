# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Certbot ACME challenge (Let's Encrypt SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # ⚠ Ersetze mit deiner echten Domain (aus .env.production: DOMAIN=...)
    server_name ${DOMAIN:-mastermind.example.com};

    # SSL certificates (von Certbot verwaltet)
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN:-mastermind.example.com}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN:-mastermind.example.com}/privkey.pem;

    # Modern SSL (TLS 1.2+)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (1 Jahr)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Static assets: aggressive caching ─────────────────────────────────
    # Next.js _next/static files are content-hashed — safe to cache forever
    location /_next/static/ {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Public uploads & brand assets (logos, favicons)
    location /uploads/ {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    location /brand/ {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        access_log off;
    }

    # Images served via Next.js image optimization
    location /_next/image {
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Service worker — never cache
    location = /sw.js {
        proxy_pass         http://nextjs;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # PWA manifest — short cache
    location = /manifest.json {
        proxy_pass         http://nextjs;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── API rate limiting ──────────────────────────────────────────────────
    location /api/ai/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;  # AI streaming braucht längeres Timeout
        proxy_buffering    off;   # SSE streaming
    }

    location /login {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/maintenance/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Default: proxy everything to Next.js ──────────────────────────────
    location / {
        limit_req zone=general burst=30 nodelay;

        proxy_pass         http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Buffer settings for better performance on slow connections
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
}
