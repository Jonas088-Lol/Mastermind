# Default — wird auf dem Server von scripts/nginx-cloudflare-realip.sh mit den
# aktuellen Cloudflare-Ranges überschrieben. Bis dahin: kein externer
# real_ip-Trust (nur Docker-internes Netz), damit nginx startet und niemand
# den CF-Connecting-IP-Header fälschen kann.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
