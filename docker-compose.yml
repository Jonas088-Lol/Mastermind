version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# MasterMind — Production Docker Compose
#
# Services:
#   db       → PostgreSQL 16 (internal only)
#   redis    → Redis 7 (rate limiting + cache, internal only)
#   app      → Next.js 16 (standalone, port 3000)
#   nginx    → Reverse proxy + SSL termination (ports 80 + 443)
#   certbot  → Let's Encrypt SSL certificate auto-renewal
#
# Usage:
#   1. cp .env.production.example .env.production
#   2. Fill in all required values in .env.production
#   3. docker compose --env-file .env.production up -d
#
# ZAP Hosting VServer notes:
#   - Empfohlen: 2 vCPU / 4 GB RAM / 50 GB SSD
#   - Port 80 + 443 in der Firewall freischalten
#   - domain in .env.production setzen: DOMAIN=deine-domain.de
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mastermind_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-mastermind}
      POSTGRES_USER:     ${POSTGRES_USER:-mastermind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mastermind} -d ${POSTGRES_DB:-mastermind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis 7 (rate limiting + session cache) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mastermind_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Next.js App ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: mastermind_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      # Database (references the db service by hostname)
      DATABASE_URL: postgresql://${POSTGRES_USER:-mastermind}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mastermind}?sslmode=disable&connection_limit=10

      # Redis (for rate limiting via Upstash-compatible interface)
      REDIS_URL: redis://redis:6379

      # Required secrets
      SESSION_SECRET:        ${SESSION_SECRET:?SESSION_SECRET is required}
      NEXT_PUBLIC_APP_URL:   ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}

      # Maintenance mode — set MAINTENANCE_MODE=true to lock the app
      MAINTENANCE_MODE:            ${MAINTENANCE_MODE:-false}
      MAINTENANCE_BYPASS_TOKEN:    ${MAINTENANCE_BYPASS_TOKEN:-}
      MAINTENANCE_ALLOWED_EMAILS:  ${MAINTENANCE_ALLOWED_EMAILS:-}

      # Optional — AI, Email, Payments, Push
      ANTHROPIC_API_KEY:             ${ANTHROPIC_API_KEY:-}
      RESEND_API_KEY:                ${RESEND_API_KEY:-}
      EMAIL_FROM:                    ${EMAIL_FROM:-noreply@mastermind.app}
      EMAIL_REPLY_TO:                ${EMAIL_REPLY_TO:-}
      STRIPE_SECRET_KEY:             ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:         ${STRIPE_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY:  ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY:             ${VAPID_PRIVATE_KEY:-}
      VAPID_EMAIL:                   ${VAPID_EMAIL:-}
      UPSTASH_REDIS_REST_URL:        ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN:      ${UPSTASH_REDIS_REST_TOKEN:-}
      # Zugangs-Gate ("Coming Soon"-Schutz)
      GATE_USER:                     ${GATE_USER:-Admin}
      GATE_PASS:                     ${GATE_PASS:?GATE_PASS is required}
      GATE_SECRET:                   ${GATE_SECRET:-}
      # Cron / Wartung / Mail-Inbound
      CRON_SECRET:                   ${CRON_SECRET:-}
      RESEND_INBOUND_SECRET:         ${RESEND_INBOUND_SECRET:-}
      # Demo-Seed-Schutz (muss in Prod false sein)
      ALLOW_DEMO_SEED:               ${ALLOW_DEMO_SEED:-false}
      # Field-Level-Encryption (2FA-/SSO-Secrets)
      FIELD_ENCRYPTION_KEYS:         ${FIELD_ENCRYPTION_KEYS:-}
      FIELD_ENCRYPTION_ACTIVE:       ${FIELD_ENCRYPTION_ACTIVE:-}
      # KI-Kostenschutz / Rate-Limiting
      AI_DAILY_CAP_PER_USER:         ${AI_DAILY_CAP_PER_USER:-50}
      SECURITY_RATE_LIMIT_ENABLED:   ${SECURITY_RATE_LIMIT_ENABLED:-true}
      FIREWALL_WHITELIST_IPS:        ${FIREWALL_WHITELIST_IPS:-}
      # Backups
      BACKUP_AGE_RECIPIENT:          ${BACKUP_AGE_RECIPIENT:-}
      # CORS
      ALLOWED_ORIGINS:               ${ALLOWED_ORIGINS:-}
    volumes:
      # Persist uploaded files (logos, favicons, user uploads) across container restarts
      - uploads_data:/app/public/uploads
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: mastermind_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      # DOMAIN is substituted into mastermind.conf.template at container startup
      DOMAIN: ${DOMAIN:-konvertis.de}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # conf.d is mounted as templates/ — nginx image runs envsubst on *.template files
      # and writes the result to /etc/nginx/conf.d/ at startup
      - ./nginx/conf.d:/etc/nginx/templates:ro
      # Cloudflare real_ip ranges (von scripts/nginx-cloudflare-realip.sh generiert)
      - ./nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      # App downloads (large binaries — served directly by nginx, not proxied through Next.js)
      # Deploy new builds with: scp file.exe server:/srv/mastermind/downloads/
      - ./downloads:/srv/downloads:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Certbot (SSL — run once to issue cert, then auto-renews) ──────────────
  certbot:
    image: certbot/certbot:latest
    container_name: mastermind_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Initial cert: docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d deine-domain.de
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    networks:
      - internal

volumes:
  postgres_data:
    name: mastermind_postgres_data
  redis_data:
    name: mastermind_redis_data
  uploads_data:
    name: mastermind_uploads_data
  certbot_webroot:
    name: mastermind_certbot_webroot
  certbot_certs:
    name: mastermind_certbot_certs

networks:
  internal:
    name: mastermind_network
    driver: bridge
