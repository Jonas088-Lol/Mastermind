name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy-DB für Build/Lint — die echten Migrations laufen im Deploy-Job
  DATABASE_URL: file:./prisma/ci.db
  SESSION_SECRET: ci-only-secret-do-not-use-in-prod

jobs:
  # Secret-Scan: eigener Job, damit ein Fund unabhängig vom Build auffällt.
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle History scannen
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  lint-and-build:
    name: Lint, Type-Check, Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations to CI DB
        run: npx prisma migrate deploy

      - name: ESLint
        run: npx eslint src/

      - name: Unit tests
        run: npm test

      - name: TypeScript build (incl. type-check)
        run: npx next build
