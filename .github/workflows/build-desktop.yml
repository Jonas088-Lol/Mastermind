name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 1.0.0)"
        required: false
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: "mastermind-windows-setup.exe"
            glob: "electron/dist/*.exe"
          - os: macos-latest
            platform: mac
            artifact: "mastermind-mac.dmg"
            glob: "electron/dist/*.dmg"
          - os: ubuntu-latest
            platform: linux
            artifact: "mastermind-linux.AppImage"
            glob: "electron/dist/*.AppImage"

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: electron
        run: npm install

      - name: Set version
        working-directory: electron
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '1.0.0' }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version

      - name: Install binutils (Linux deb build)
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y binutils

      - name: Build ${{ matrix.platform }}
        working-directory: electron
        run: npm run build:${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mastermind-${{ matrix.platform }}
          path: ${{ matrix.glob }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    name: Create Release

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MasterMind ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.AppImage
          body: |
            ## MasterMind Desktop ${{ github.ref_name }}

            ### Downloads

            | Plattform | Datei |
            |-----------|-------|
            | Windows | `mastermind-windows-setup.exe` |
            | macOS | `mastermind-mac.dmg` |
            | Linux | `mastermind-linux.AppImage` |

            ### Installation

            **Windows:** Setup-Datei herunterladen und ausführen.
            **macOS:** DMG öffnen, App in Programme ziehen.
            **Linux:** AppImage herunterladen, ausführbar machen (`chmod +x`), starten.

            > Die App lädt alle Inhalte direkt vom MasterMind-Server — Updates sind immer automatisch aktiv.
