name: Deploy to Server

# Deployt automatisch bei jedem Push auf master — und manuell per Button
# (Actions-Tab → "Deploy to Server" → "Run workflow").
#
# Sicher: Schlägt der Docker-Build auf dem Server fehl, laufen die alten
# Container einfach weiter — die Live-App geht nie durch einen kaputten Build
# offline.
#
# Benötigte GitHub-Secrets (Repo → Settings → Secrets and variables → Actions):
#   DEPLOY_HOST     Server-IP (z. B. 87.237.53.143)
#   DEPLOY_USER     SSH-User (root)
#   DEPLOY_SSH_KEY  Privater Deploy-Schlüssel (siehe docs/ops/ci-cd.md)
#   DEPLOY_PATH     Repo-Pfad auf dem Server (z. B. /root/Mastermind)

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # laufenden Deploy nie abbrechen

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          # Das Skript macht git pull, baut nur den App-Container neu und wartet
          # auf den Health-Check (fail-safe: alter Container bleibt bei Fehler oben).
          script: |
            set -e
            bash "${{ secrets.DEPLOY_PATH }}/scripts/deploy.sh"
