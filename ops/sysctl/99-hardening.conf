# ── Kernel-/Netzwerk-Härtung für MasterMind ────────────────────────────────
# Ziel: /etc/sysctl.d/99-hardening.conf → danach `sudo sysctl --system`
#
# WARUM: Schutz gegen Spoofing, SYN-Floods (L3/4-DDoS), Redirect-Angriffe und
# Informationslecks über den Kernel-Log. Ergänzt die ufw-Firewall auf
# Kernel-Ebene (Defense in Depth).

# ── Anti-Spoofing: Reverse-Path-Filter (Pakete mit gefälschter Quell-IP dropen)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ── SYN-Flood-Schutz (SYN-Cookies)
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

# ── ICMP-Redirects ignorieren (verhindert MITM über gefälschte Routen)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# ── Keine Redirects senden (Server ist kein Router)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# ── Source-Routing ablehnen (Angreifer kann Routing nicht erzwingen)
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# ── Martian-Pakete loggen (unmögliche Quell-/Zieladressen → Angriffsindiz)
net.ipv4.conf.all.log_martians = 1

# ── Broadcast-ICMP ignorieren (Smurf-Angriff-Schutz)
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ── Informationslecks eindämmen
kernel.dmesg_restrict = 1              # dmesg nur für root (kein Kernel-Info-Leak)
kernel.kptr_restrict = 2              # Kernel-Pointer in /proc verstecken
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.suid_dumpable = 0                  # keine Core-Dumps von SUID-Prozessen

# ── ASLR maximal
kernel.randomize_va_space = 2

# ── BPF für nicht-privilegierte Nutzer sperren
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
