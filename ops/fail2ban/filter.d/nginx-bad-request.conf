# Fail2ban-Filter: nginx 444/403/400-Antworten (Origin-Scans, Angriffe)
# Ziel: /etc/fail2ban/filter.d/nginx-bad-request.conf
#
# Matcht Access-Log-Zeilen mit Status 444, 403 oder 400. Die IP steht dank
# real_ip (Phase 2) als echte Client-IP am Zeilenanfang.
[Definition]
failregex = ^<HOST> .* "(GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH)[^"]*" (444|403|400)
ignoreregex =
