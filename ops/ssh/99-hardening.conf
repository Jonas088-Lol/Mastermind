# ── SSH-Härtung für MasterMind (Ubuntu 24.04) ──────────────────────────────
# Ziel: /etc/ssh/sshd_config.d/99-hardening.conf
#
# WARUM jede Regel: SSH ist der einzige direkte Admin-Zugang zum Origin-Server.
# Ein kompromittierter SSH-Zugang = Totalverlust. Wir minimieren die
# Angriffsfläche maximal (Key-only, kein root, moderne Krypto).
#
# ⚠ VOR DEM ANWENDEN: Stelle sicher, dass dein Ed25519-Public-Key in
#   ~/.ssh/authorized_keys des AllowUsers-Kontos liegt UND eine zweite
#   SSH-Session offen ist — sonst sperrst du dich aus.

# Nur Protokoll 2, kein Passwort, kein root
PasswordAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no
UsePAM yes

# Keine leeren Passwörter, kein Host-based, kein X11
PermitEmptyPasswords no
HostbasedAuthentication no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Non-Standard-Port (reduziert Bot-Rauschen; KEIN echter Schutz, aber weniger Logs)
# ⚠ Diesen Port auch in ufw freigeben (siehe ufw-cloudflare.sh) BEVOR du sshd neu startest.
Port 2222

# Nur diese Nutzer dürfen sich per SSH anmelden (Platzhalter — ersetzen!)
AllowUsers deploy

# Moderne Krypto — alte/schwache Algorithmen deaktiviert
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Session-Limits: automatische Trennung inaktiver/hängender Sessions
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 4

# Kein DNS-Lookup (schneller Login), keine Legacy-Features
UseDNS no
PermitTunnel no
AllowStreamLocalForwarding no
