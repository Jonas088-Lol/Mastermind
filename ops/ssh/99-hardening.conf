# ── SSH-Härtung (pragmatisch) für MasterMind ───────────────────────────────
# Ziel: /etc/ssh/sshd_config.d/99-hardening.conf
#
# Variante "pragmatisch": root bleibt, aber NUR per Key. Kein Port-Wechsel,
# kein separater deploy-User — passend für einen Solo-Test-/Prod-Server.
#
# ⚠ DIESE DATEI ERST EINSPIELEN, WENN EIN SSH-KEY EINGERICHTET UND GETESTET IST.
#   Sie schaltet Passwort-Login AB (PasswordAuthentication no). Ohne
#   funktionierenden Key sperrst du dich aus. Ablauf: docs/security/ssh-setup.md

# Kein Passwort mehr — nur noch Public-Key
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
UsePAM yes

# root darf rein, aber NUR mit Key (nicht mit Passwort)
PermitRootLogin prohibit-password

# Keine unsicheren Auth-Methoden
PermitEmptyPasswords no
HostbasedAuthentication no
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no

# Moderne Krypto — alte/schwache Algorithmen aus
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group16-sha512
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# Session-Limits
ClientAliveInterval 300
ClientAliveCountMax 2
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 4
UseDNS no
